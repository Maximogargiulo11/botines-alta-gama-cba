<title>Botines Alta Gama CBA — Lanzamientos & Catálogo Premium</title>
<meta name="description" content="Importadores oficiales de botines premium en Córdoba, Argentina. Lanzamientos exclusivos, stock limitado." />

<style>
  /* ─────────────────────────────────────────────
     TOKENS
  ───────────────────────────────────────────── */
  :root {
    --bg:          #080808;
    --bg-2:        #0e0e0e;
    --bg-3:        #181818;
    --bg-4:        #1f1f1f;
    --line:        rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.18);
    --text:        #f0ece4;
    --text-dim:    rgba(240,236,228,0.60);
    --text-muted:  rgba(240,236,228,0.35);
    --accent:      #f0ece4;
    --gold:        #c9a96e;
    --gold-dim:    rgba(201,169,110,0.18);
    --display:     'Cormorant Garamond', Georgia, serif;
    --body:        'DM Sans', system-ui, sans-serif;
    --mono:        'IBM Plex Mono', monospace;
    --radius:      2px;
    --ease-out:    cubic-bezier(0.22, 1, 0.36, 1);
    --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ─────────────────────────────────────────────
     RESET
  ───────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body { overflow-x: hidden; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  img { display: block; max-width: 100%; }

  ::selection { background: var(--gold); color: #080808; }

  /* ─────────────────────────────────────────────
     SCROLLBAR
  ───────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: rgba(201,169,110,0.3); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

  /* ─────────────────────────────────────────────
     GRAIN OVERLAY
  ───────────────────────────────────────────── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 9998;
    pointer-events: none;
    opacity: 0.032;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 180px 180px;
  }

  /* ─────────────────────────────────────────────
     BOOT SCREEN
  ───────────────────────────────────────────── */
  .__boot {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
    z-index: 9999;
    /* fade out after 1.8s — cubic-bezier inline para evitar bug con var() en animation shorthand */
    animation: bootFadeOut 0.7s cubic-bezier(0.22, 1, 0.36, 1) 1.8s forwards;
  }

  .__boot-logo {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    opacity: 0;
    animation: bootReveal 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
  }

  .__boot-wordmark {
    font-family: var(--display);
    font-size: clamp(18px, 3vw, 28px);
    font-weight: 300;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--text);
  }

  .__boot-sub {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0;
    animation: bootReveal 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
  }

  .__boot-line {
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: bootLine 1.0s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
  }

  @keyframes bootReveal {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes bootLine {
    from { width: 0; opacity: 0; }
    to   { width: 120px; opacity: 1; }
  }
  @keyframes bootFadeOut {
    from { opacity: 1; }
    to   { opacity: 0; pointer-events: none; }
  }

  /* ─────────────────────────────────────────────
     LAYOUT
  ───────────────────────────────────────────── */
  .container {
    max-width: 1440px;
    margin: 0 auto;
    padding: 0 48px;
  }
  @media (max-width: 1024px) { .container { padding: 0 32px; } }
  @media (max-width: 768px)  { .container { padding: 0 20px; } }
  @media (max-width: 480px)  { .container { padding: 0 16px; } }

  /* ─────────────────────────────────────────────
     TYPOGRAPHY UTILITIES
  ───────────────────────────────────────────── */
  .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    display: inline-block;
  }

  /* ─────────────────────────────────────────────
     BUTTONS
  ───────────────────────────────────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 28px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    transition: all 0.3s var(--ease-out);
    cursor: pointer;
    border: 1px solid transparent;
    border-radius: var(--radius);
    position: relative;
    overflow: hidden;
  }

  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.06);
    opacity: 0;
    transition: opacity 0.25s;
  }
  .btn:hover::after { opacity: 1; }

  .btn-primary {
    background: var(--text);
    color: #080808;
    border-color: var(--text);
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--gold);
    border-color: var(--gold);
    transform: translateY(-1px);
    box-shadow: 0 12px 32px rgba(201,169,110,0.22);
  }

  .btn-ghost {
    background: transparent;
    color: var(--text-dim);
    border-color: var(--line-strong);
  }
  .btn-ghost:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  .btn-gold {
    background: var(--gold);
    color: #080808;
    border-color: var(--gold);
  }
  .btn-gold:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 12px 32px rgba(201,169,110,0.30);
    filter: brightness(1.08);
  }

  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  @media (max-width: 480px) {
    .btn { padding: 12px 20px; font-size: 9px; letter-spacing: 0.18em; }
    .eyebrow { font-size: 9px; letter-spacing: 0.2em; }
  }
  @media (hover: none) { .btn { min-height: 48px; } }

  /* ─────────────────────────────────────────────
     HERO IMAGE RESPONSIVE
  ───────────────────────────────────────────── */
  .hero-img-contain { max-width: 60%; }
  @media (max-width: 768px) { .hero-img-contain { max-width: 88%; } }
  @media (max-width: 480px) { .hero-img-contain { max-width: 96% !important; } }

  /* ─────────────────────────────────────────────
     PAGE TRANSITION
  ───────────────────────────────────────────── */
  .page-fade {
    animation: pageIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ─────────────────────────────────────────────
     CARD HOVER EFFECTS (global)
  ───────────────────────────────────────────── */
  .zoom-img {
    transition: transform 0.8s var(--ease-out);
    will-change: transform;
  }
  .article-card-lg:hover .zoom-img,
  .side-card:hover .zoom-img,
  .news-card:hover .zoom-img {
    transform: scale(1.05);
  }

  .article-card-lg h2,
  .side-card h3,
  .news-card h3 {
    transition: color 0.3s;
  }
  .side-card:hover h3,
  .news-card:hover h3 {
    color: var(--gold);
  }

  /* ─────────────────────────────────────────────
     NAV
  ───────────────────────────────────────────── */
  .navlink {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 500;
    padding: 6px 0;
    border-bottom: 1px solid transparent;
    transition: all 0.25s;
  }
  .navlink:hover { color: var(--text); }
  .navlink.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }

  @media (min-width: 900px) {
    .navlinks  { display: flex !important; }
    .navtoggle { display: none !important; }
    .mobilemenu { display: none !important; }
  }
  @media (max-width: 480px) {
    .cart-icon-btn span:nth-of-type(1) { display: none; }
  }

  /* ─────────────────────────────────────────────
     FOOTER LINKS
  ───────────────────────────────────────────── */
  .footerlink {
    color: var(--text-muted);
    font-size: 13px;
    transition: color 0.25s;
  }
  .footerlink:hover { color: var(--gold); }

  /* ─────────────────────────────────────────────
     TODAY GRID
  ───────────────────────────────────────────── */
  @media (max-width: 900px) {
    .today-grid { grid-template-columns: 1fr !important; }
  }

  /* ─────────────────────────────────────────────
     GOLD ACCENT DIVIDER
  ───────────────────────────────────────────── */
  .gold-rule {
    width: 48px; height: 1px;
    background: var(--gold);
    display: block;
    margin: 0 auto 24px;
  }

  /* ─────────────────────────────────────────────
     FOCUS STYLES (accessibility)
  ───────────────────────────────────────────── */
  :focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
    border-radius: var(--radius);
  }

</style>
</head>
