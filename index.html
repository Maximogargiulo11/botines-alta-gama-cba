<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Botines Alta Gama CBA — Lanzamientos & Catálogo Premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #000000;
    --bg-2: #0a0a0a;
    --bg-3: #141414;
    --line: rgba(255,255,255,0.1);
    --line-strong: rgba(255,255,255,0.22);
    --text: #ffffff;
    --text-dim: rgba(255,255,255,0.62);
    --text-muted: rgba(255,255,255,0.42);
    --accent: #ffffff;
    --display: 'Playfair Display', serif;
    --body: 'Inter', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: var(--body); -webkit-font-smoothing: antialiased; }
  body { overflow-x: hidden; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  img { display: block; max-width: 100%; }

  ::selection { background: #fff; color: #000; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  .__boot {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display); font-size: 22px; letter-spacing: 0.3em;
    color: var(--accent); z-index: 9999;
    animation: bootPulse 1.6s ease-in-out infinite;
  }
  @keyframes bootPulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

  .container { max-width: 1440px; margin: 0 auto; padding: 0 32px; }
  @media (max-width: 768px) { .container { padding: 0 20px; } }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
    display: inline-block;
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 16px 26px;
    font-family: var(--body);
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.2em; text-transform: uppercase;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    border: 1px solid transparent;
    gap: 10px;
  }
  .btn-primary {
    background: var(--accent);
    color: #000;
  }
  .btn-primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 10px 30px rgba(255,255,255,0.18);
  }
  .btn-ghost {
    background: transparent;
    color: var(--text);
    border-color: var(--line-strong);
  }
  .btn-ghost:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
</style>
</head>
<body>
<div id="root"><div class="__boot">BOTINES ALTA GAMA</div></div>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
